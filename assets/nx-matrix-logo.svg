<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
<title id="title">NX Matrix AI for Microsoft Teams</title>
<desc id="desc">NX Matrix AI monogram linked by a glowing arc to a Teams-inspired purple tile with a T and user shapes.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08152d"/><stop offset="1" stop-color="#140d32"/></linearGradient>
 <linearGradient id="nx" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55f0de"/><stop offset=".48" stop-color="#2b9dff"/><stop offset="1" stop-color="#9668ff"/></linearGradient>
 <linearGradient id="team" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b9cff"/><stop offset="1" stop-color="#5934d6"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="640" height="240" rx="28" fill="url(#bg)"/>
<path d="M44 122 C70 37 217 24 284 97 S440 206 586 100" fill="none" stroke="url(#nx)" stroke-width="4" opacity=".72" filter="url(#glow)"/>
<g fill="none" stroke="url(#nx)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
 <path d="M54 55v108l76-108v108"/>
 <path d="M150 55l78 108M228 55l-78 108"/>
</g>
<g fill="#55e6d0"><circle cx="54" cy="55" r="6"/><circle cx="130" cy="163" r="6"/></g>
<g transform="translate(300 45)">
 <circle cx="88" cy="30" r="19" fill="#9b8bff"/>
 <circle cx="124" cy="45" r="15" fill="#7761f2"/>
 <path d="M62 66c0-13 11-23 25-23s25 10 25 23v60c0 22-17 39-38 39s-38-17-38-39V89c0-13 11-23 26-23z" fill="#7f73f5"/>
 <path d="M119 75c0-11 9-20 20-20s20 9 20 20v43c0 18-14 32-32 32h-8z" fill="#5b47d9"/>
 <rect x="20" y="55" width="92" height="92" rx="17" fill="url(#team)" stroke="#b7c1ff" stroke-opacity=".55" stroke-width="2"/>
 <path d="M42 78h49v12H73v44H60V90H42z" fill="#fff"/>
</g>
<text x="320" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="3" text-anchor="middle" fill="#f5f7ff">NX MATRIX <tspan fill="#8f7bff">AI</tspan></text>
</svg>